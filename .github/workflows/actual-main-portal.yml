name: Original course managed portal

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TEMPLATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  QUARTO_RUN_NO_NETWORK: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student_release:
    name: Original course student release (${{ matrix.quarto }})
    runs-on: ubuntu-24.04
    # The original 4 book inputs and 5 essay inputs plus Navigation use 38 captures.
    # Each 150 minute job renders one fresh original-course attempt, preserving inputs.
    # Current proofs, native members, PDF and setup are included in this budget.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.10.18', '1.11.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEMPLATE_HEAD }}
          path: template
          persist-credentials: false
      - name: Exact provider refs from one contract file
        id: refs
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          refs = json.loads(Path('template/tests/probes/portal-provider-refs.json').read_text())
          assert set(refs) == {'publisher', 'qrc', 'core', 'download'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name, ref in refs.items():
                  assert set(ref) == {'commit', 'tree'}
                  assert all(re.fullmatch('[a-f0-9]{40}', value) for value in ref.values())
                  out.write(f'{name}={ref["commit"]}\n')
          PY
      - name: Core, Presentation and Navigation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: ${{ steps.refs.outputs.core }}
          path: core
          persist-credentials: false
      - name: Managed Publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: ${{ steps.refs.outputs.publisher }}
          path: publisher
          persist-credentials: false
      - name: Portal QRC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: ${{ steps.refs.outputs.qrc }}
          path: qrc
          persist-credentials: false
      - name: Native Download ownership
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: ${{ steps.refs.outputs.download }}
          path: download
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - name: Native PDF and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended lmodern fonts-lmodern fonts-dejavu poppler-utils file
          kpsewhich lmodern.sty
      - name: Genuine original student release with fresh current proof
        working-directory: template
        run: |
          export QUARTO="$(command -v quarto)"
          quarto run tests/probes/actual-main-consumer.ts \
            --phase student-release \
            --publisher "$GITHUB_WORKSPACE/publisher" \
            --qrc "$GITHUB_WORKSPACE/qrc" \
            --core "$GITHUB_WORKSPACE/core" \
            --download "$GITHUB_WORKSPACE/download" \
            --output "$RUNNER_TEMP/actual-main-evidence"
      - name: Release result or first refusal
        if: always()
        env:
          ACTUAL_MAIN_EVIDENCE: ${{ runner.temp }}/actual-main-evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ACTUAL_MAIN_EVIDENCE'])
          for name in ['install-manifest.json', 'phase-results.json', 'partial-results.json']:
              path = root / name
              if path.exists():
                  print(name, json.dumps(json.loads(path.read_text()), indent=2))
          if not (root / 'phase-results.json').exists():
              for path in sorted(root.glob('*.log')):
                  print(path.name, path.read_text()[-12000:])
          PY
      - name: Complete release logs, maps, archives and public publications
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-main-native-${{ matrix.quarto }}-student-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/actual-main-evidence/*.json
            ${{ runner.temp }}/actual-main-evidence/*.jsonl
            ${{ runner.temp }}/actual-main-evidence/*.log
            ${{ runner.temp }}/actual-main-evidence/archives/
            ${{ runner.temp }}/actual-main-evidence/failure-diagnostics/
            ${{ runner.temp }}/actual-main-evidence/publications.tar.gz
      - name: Verified public baseline only for downstream preservation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-main-public-${{ matrix.quarto }}-student-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/actual-main-evidence/publications.tar.gz
            ${{ runner.temp }}/actual-main-evidence/public-baseline.json

  full_release:
