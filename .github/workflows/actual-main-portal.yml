        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended lmodern fonts-lmodern fonts-dejavu poppler-utils file
          kpsewhich lmodern.sty
      - name: Same-run same-channel completed public baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: actual-main-public-${{ matrix.quarto }}-full-release
          digest-mismatch: error
          path: ${{ runner.temp }}/actual-main-baseline
      - name: Fresh current proof and preservation after late refusal
        working-directory: template
        run: |
          export QUARTO="$(command -v quarto)"
          quarto run tests/probes/actual-main-consumer.ts \
            --phase late \
            --baseline "$RUNNER_TEMP/actual-main-baseline" \
            --publisher "$GITHUB_WORKSPACE/publisher" \
            --qrc "$GITHUB_WORKSPACE/qrc" \
            --core "$GITHUB_WORKSPACE/core" \
            --download "$GITHUB_WORKSPACE/download" \
            --output "$RUNNER_TEMP/actual-main-evidence"
      - name: Late result or first refusal
        if: always()
        env:
          ACTUAL_MAIN_EVIDENCE: ${{ runner.temp }}/actual-main-evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ACTUAL_MAIN_EVIDENCE'])
          for name in ['install-manifest.json', 'phase-results.json', 'partial-results.json']:
              path = root / name
              if path.exists():
                  print(name, json.dumps(json.loads(path.read_text()), indent=2))
          if not (root / 'phase-results.json').exists():
              for path in sorted(root.glob('*.log')):
                  print(path.name, path.read_text()[-12000:])
          PY
      - name: Complete fresh late logs, maps, archives and phase receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-main-native-${{ matrix.quarto }}-late
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/actual-main-evidence/*.json
            ${{ runner.temp }}/actual-main-evidence/*.jsonl
            ${{ runner.temp }}/actual-main-evidence/*.log
            ${{ runner.temp }}/actual-main-evidence/archives/
            ${{ runner.temp }}/actual-main-evidence/failure-diagnostics/
            ${{ runner.temp }}/actual-main-evidence/publications.tar.gz

  complete:
    name: Original course, both channels and all three phases
    needs: [student_release, full_release, late]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEMPLATE_HEAD }}
          path: template
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.18'
      - name: Required original-course receipt guards
        working-directory: template
        run: |
          quarto run tests/probes/actual-main-receipt-guards.ts
          quarto run tests/probes/actual-main-transfer-guards.ts
          quarto run tests/probes/actual-main-public-guards.ts
          quarto run tests/probes/actual-main-split-guards.ts
      - name: Only artifacts from the current workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: actual-main-native-*
          merge-multiple: false
          digest-mismatch: error
          path: ${{ runner.temp }}/actual-main-artifacts
      - name: Required exact-head, provider, maps and genuine-course aggregation
        working-directory: template
        env:
          ACTUAL_MAIN_STUDENT_JOBS_RESULT: ${{ needs.student_release.result }}
          ACTUAL_MAIN_FULL_JOBS_RESULT: ${{ needs.full_release.result }}
          ACTUAL_MAIN_LATE_JOBS_RESULT: ${{ needs.late.result }}
        run: |
          quarto run tests/probes/actual-main-aggregate.ts \
            --artifacts "$RUNNER_TEMP/actual-main-artifacts" \
            --expected-head "$TEMPLATE_HEAD" \
            --student-jobs-result "$ACTUAL_MAIN_STUDENT_JOBS_RESULT" \
            --full-jobs-result "$ACTUAL_MAIN_FULL_JOBS_RESULT" \
            --late-jobs-result "$ACTUAL_MAIN_LATE_JOBS_RESULT" \
            --output "$RUNNER_TEMP/actual-main-complete-ci.json"
      - name: Verified original-course complete receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-main-complete-receipt
          if-no-files-found: error
          path: ${{ runner.temp }}/actual-main-complete-ci.json
