  late:
    name: Original course fresh late check (${{ matrix.quarto }})
    needs: full_release
    runs-on: ubuntu-24.04
    # A fresh original-course attempt uses 38 captures; budget conservatively 40.
    # The 150 minute single-attempt budget includes current proofs, members and PDF.
    # Only completed public trees seed preservation checks. Current source,
    # installations, owners, native captures and publication proofs are fresh.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        quarto: ['1.10.18', '1.11.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEMPLATE_HEAD }}
          path: template
          persist-credentials: false
      - name: Exact provider refs from one contract file
        id: refs
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          refs = json.loads(Path('template/tests/probes/portal-provider-refs.json').read_text())
          assert set(refs) == {'publisher', 'qrc', 'core', 'download'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name, ref in refs.items():
                  assert set(ref) == {'commit', 'tree'}
                  assert all(re.fullmatch('[a-f0-9]{40}', value) for value in ref.values())
                  out.write(f'{name}={ref["commit"]}\n')
          PY
      - name: Core, Presentation and Navigation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: ${{ steps.refs.outputs.core }}
          path: core
          persist-credentials: false
      - name: Managed Publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-publish
          ref: ${{ steps.refs.outputs.publisher }}
          path: publisher
          persist-credentials: false
      - name: Portal QRC
