        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: ${{ steps.refs.outputs.qrc }}
          path: qrc
          persist-credentials: false
      - name: Native Download ownership
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Afonenko-Course-Tools/quarto-project-download
          ref: ${{ steps.refs.outputs.download }}
          path: download
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ matrix.quarto }}
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
