project:
  type: website
  output-dir: .project-publish/native
  render: []
  resources:
    - "!book/**"
    - "!lectures/**"
    - "!practice/**"
    - "!essay/**"
    - "!handouts/**"
    - "!examples/**"
    - "!fixtures/**"
    - "!tests/**"
    - "!docs/**"
    - "!_extensions/**"
    - "!_publication/**"
    - "!.project-publish/**"
    - "!_generated/**"
    - "!_site*/**"
  pre-render:
    - _extensions/Afonenko-Course-Tools/project-publish/entrypoints/pre.ts
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/owner-freeze.ts
  post-render: _extensions/Afonenko-Course-Tools/project-publish/entrypoints/post.ts
  preview:
    watch-inputs: false
    serve:
      cmd: "quarto run ../preview.ts --port {port} --host {host}"
      ready: "Публикация предпросмотр готов"
format: html
lang: ru
course:
  id: template-navigation
website:
  title: Учебный курс
  search: true
filters:
  - course-core
  - reference-catalog
reference-catalog:
  namespace: site
  publication:
    title: Учебный курс
  exports:
    site: [sec-course]
    book: [sec-contracts, sec-contract-demo]
    essay: [sec-essays, sec-utf8-policies]
  imports:
    os:
      source: fixtures/external-reference.json
      namespace: book
      base-url: https://example.edu/os/
      style: external

profile:
  default: student
  group: [[student, full]]

project-publish:
  portal: index.qmd
  output-dir: _site
  projects:
    book: {path: book, format: html}
    lectures: {path: lectures, format: revealjs}
    practice: {path: practice, format: revealjs}
    essay: {path: essay, format: html}
    handouts: {path: handouts, format: pdf, mount: handouts}
  integrations:
    - _publication/prepare.ts
    - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/publication.ts
    - _publication/finish.ts
    - _publication/verify.ts
